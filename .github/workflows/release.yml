name: Release (Windows installer + Android APK)

# Every time you commit to the main branch (upload / edit files on github.com), this builds
# the Windows installer + the Android APK and puts them on the "Releases" page as version 1.0.<N>.
# Installed CineFTP apps then show an "update available" notification.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - id: v
        run: echo "v=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run desktop:prepare
      - name: Create release tag v${{ needs.version.outputs.v }}
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git tag "v${{ needs.version.outputs.v }}"
          git push origin "v${{ needs.version.outputs.v }}"
      - name: Create the release (so uploads never create duplicates)
        shell: bash
        run: gh release create "v${{ needs.version.outputs.v }}" --title "CineFTP ${{ needs.version.outputs.v }}" --notes "Windows installer (auto-updates) and Android APK." --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + publish installer (creates the GitHub release v${{ needs.version.outputs.v }})
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --x64 --publish always "-c.extraMetadata.version=${{ needs.version.outputs.v }}" 2>&1 | tee build.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Save build log on failure (branch ci-logs)
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --quiet . || true
          tail -n 300 build.log > ../ci.log 2>/dev/null || true
          mv ../ci.log windows-build.log 2>/dev/null || echo "no log" > windows-build.log
          git add windows-build.log
          git commit -q -m "windows build log"
          git push -f origin ci-logs

  android:
    needs: [version, windows]
    if: ${{ needs.windows.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm install --legacy-peer-deps --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx vite build
      - run: npx cap add android
      - run: pip install pillow && python scripts/android-prepare.py
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Attach APK to the release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "CineFTP-${{ needs.version.outputs.v }}.apk"
          gh release upload "v${{ needs.version.outputs.v }}" "CineFTP-${{ needs.version.outputs.v }}.apk" --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
