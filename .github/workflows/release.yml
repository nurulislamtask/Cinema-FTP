name: Release (Windows installer + Android APK)

# Every time you commit to the main branch (upload / edit files on github.com), this builds
# the Windows installer + the Android APK and puts them on the "Releases" page as version 1.0.<N>.
# Installed CineFTP apps then show an "update available" notification.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - id: v
        run: echo "v=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    outputs:
      repo: ${{ steps.rel.outputs.repo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run desktop:prepare
        env:
          APP_VERSION: ${{ needs.version.outputs.v }}
      - name: Create the release (public CineFTP-Releases repo; falls back to this repo if the token is rejected)
        id: rel
        shell: bash
        run: |
          V="v${{ needs.version.outputs.v }}"
          {
            echo "--- token diagnostics ---"
            echo "secret length: ${#RELEASES_TOKEN}"
            GH_TOKEN="$RELEASES_TOKEN" gh api -i repos/nurulislamtask/CineFTP-Releases 2>&1 | grep -iE "^HTTP|x-oauth-scopes|x-accepted|\"(push|admin|pull)\"|\"private\"|\"message\"" | head -12
            GH_TOKEN="$RELEASES_TOKEN" gh api -i repos/nurulislamtask/CineFTP-Releases/contents/README.md 2>&1 | grep -iE "^HTTP|x-accepted|\"message\"" | head -4
            echo "--- end diagnostics ---"
          } 2>&1 | tee build.log
          if [ -n "$RELEASES_TOKEN" ] && GH_TOKEN="$RELEASES_TOKEN" gh release create "$V" --repo nurulislamtask/CineFTP-Releases --title "CineFTP ${{ needs.version.outputs.v }}" --notes "Windows installer (auto-updates) and Android APK." 2>&1 | tee build.log; then
            echo "repo=CineFTP-Releases" >> "$GITHUB_OUTPUT"
          else
            echo "WARNING: RELEASES_TOKEN rejected, publishing to this repository instead" | tee -a build.log
            GH_TOKEN="$GITHUB_TOKEN" gh release create "$V" --repo "${{ github.repository }}" --title "CineFTP ${{ needs.version.outputs.v }}" --notes "Windows installer and Android APK." 2>&1 | tee -a build.log
            echo "repo=${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + publish installer (creates the GitHub release v${{ needs.version.outputs.v }})
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --x64 --publish always "-c.extraMetadata.version=${{ needs.version.outputs.v }}" "-c.publish.repo=${{ steps.rel.outputs.repo }}" 2>&1 | tee -a build.log
        env:
          GH_TOKEN: ${{ steps.rel.outputs.repo == 'CineFTP-Releases' && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Save build log on failure (branch ci-logs)
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --quiet . || true
          tail -n 300 build.log > ../ci.log 2>/dev/null || true
          mv ../ci.log windows-build.log 2>/dev/null || echo "no log" > windows-build.log
          git add windows-build.log
          git commit -q -m "windows build log"
          git push -f origin ci-logs

  android:
    needs: [version, windows]
    if: ${{ needs.windows.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm install --legacy-peer-deps --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx vite build
        env:
          APP_VERSION: ${{ needs.version.outputs.v }}
      - run: npx cap add android
      - run: pip install pillow && python scripts/android-prepare.py
        env:
          APP_VERSION: ${{ needs.version.outputs.v }}
          APP_VERSION_CODE: ${{ github.run_number }}
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Attach APK to the release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "CineFTP-${{ needs.version.outputs.v }}.apk"
          gh release upload "v${{ needs.version.outputs.v }}" "CineFTP-${{ needs.version.outputs.v }}.apk" --clobber --repo "nurulislamtask/${{ needs.windows.outputs.repo }}"
        env:
          GH_TOKEN: ${{ needs.windows.outputs.repo == 'CineFTP-Releases' && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
